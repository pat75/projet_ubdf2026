# ISOLATED_PHP_VERSION=php@8.3
server {
    listen 127.0.0.1:80;
    #listen 127.0.0.1:80; # valet loopback
    server_name ubdf2026.ultra-book.name www.ubdf2026.ultra-book.name *.ubdf2026.ultra-book.name;
    return 301 https://$host$request_uri;
}

server {
    listen 127.0.0.1:443 ssl;
    #listen 127.0.0.1:443 ssl; # valet loopback
    server_name ubdf2026.ultra-book.name www.ubdf2026.ultra-book.name *.ubdf2026.ultra-book.name;
    root "/Users/pat/Sites_2026/projet_ubdf2026/public";
    index index.php index.html;
    charset utf-8;
    client_max_body_size 512M;
    http2  on;

    location /41c270e4-5535-4daa-b23e-c269744c2f45/ {
        internal;
        alias /;
        try_files $uri $uri/;
    }

    ssl_certificate "/Users/pat/.config/valet/Certificates/ubdf2026.ultra-book.name.crt";
    ssl_certificate_key "/Users/pat/.config/valet/Certificates/ubdf2026.ultra-book.name.key";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    access_log off;
    error_log "/Users/pat/.config/valet/Log/nginx-error.log";


    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass "unix:/Users/pat/.config/valet/valet83.sock";
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.ht {
        deny all;
    }
}

